name: design-system

on:
  push:
    paths: ["design-system/**", ".github/workflows/design-system.yml"]
  pull_request:
    paths: ["design-system/**", ".github/workflows/design-system.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tokens.css está al día con tokens/*.json
        run: node design-system/scripts/build-tokens.mjs --check
      - name: Contraste WCAG AA
        run: node design-system/scripts/check-contrast.mjs
